[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advancetether"
version = "1.0.0"
description = "AdvanceTether (ATP/1.0) — Cross-language Peer-to-Peer Messaging, DHT, Pub/Sub, File Transfer & Tunneling SDK"
readme = "../../README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AdvanceTether Contributors"}]

[project.scripts]
atp-py = "advancetether.cli:main"
